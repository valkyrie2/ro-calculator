<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ragnarok Online Calculator</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // When GitHub Pages serves a 404, redirect to /?/path so index.html can restore it.
      // pathSegmentsToKeep=0 because the app is served from the domain root.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
